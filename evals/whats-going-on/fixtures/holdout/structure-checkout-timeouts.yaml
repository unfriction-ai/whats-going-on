    expect:
      kind: structure
      statuses: [structured]
      root_anchor: ["checkout|timeout|latency"]
      min_breakdowns: 1
      selection_ask: true
    tripwires:
      invented: ["p99", "12.4%"]
      methodNotProblem: []
      solveLeak: ["raise the pool", "the root cause is"]
    gold: |
