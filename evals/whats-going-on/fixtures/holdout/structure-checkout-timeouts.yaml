turns:
  - command: /where-to-focus
    input: |
      Shoppers on the web checkout see API timeouts when they pay.
      The latency sits on the checkout request, not on search.
      One open cut is the connection pool rejecting calls versus an upstream service running slow.
      The other open cut is timeouts that cluster on one endpoint versus timeouts that spread across endpoints.
      Which checkout timeout cause should we test first?
