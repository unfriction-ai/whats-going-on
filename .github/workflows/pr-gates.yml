# scripts/pr-gates.sh owns the gate list. This job only prepares Python.
name: pr-gates

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-gates-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    name: PR gates
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: evals/whats-going-on/requirements.txt

      - name: Install eval harness deps
        run: python -m pip install -r evals/whats-going-on/requirements.txt

      - name: Run PR gates
        run: bash scripts/pr-gates.sh
